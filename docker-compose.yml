version: '3.8' 
services: 
  # Container do PostgreSQL 
  postgres: 
    image: postgres:16-alpine 
    container_name: postgres_telemetria 
    environment: 
      POSTGRES_DB: telemetria_db 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: 123 
    ports: 
      - "5433:5432" 
    volumes: 
      # Mapeia a pasta local com os dados para dentro do container 
      - ./dados:/dados 
